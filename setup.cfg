[aliases]
test=pytest

[tool:pytest]
confcutdir = sparkmeter
addopts =
  --ignore=venv
  --tb=short
  --no-cov-on-fail
  --cov=sparkmeter
  --cov-report term-missing:skip-covered
  --cov-report xml:.coverage.xml
norecursedirs =
    .eggs .git build venv venv-3.6
    scripts/config/node_modules dist deploy/build
    node_docker venv_docker
python_classes = *Test Test*

[coverage:xml]
output=.coverage.xml

[coverage:run]
relative_files = True
omit =
     **/test_*.py
     sparkmeter/tests/base.py

[flake8]
select = E,W,H
max-line-length = 110
