[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sparkmeter"
dynamic = ["version"]
description = "Sparkmeter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv",
    "uv",
    "zope.component",
    "future",
    "packaging",

    # Sentry. Both extras are needed: FlaskIntegration captures errors
    # raised in the WSGI-mounted Flask app; FastApiIntegration covers
    # the native FastAPI routes.
    "sentry-sdk[flask,fastapi]",

    # Flask
    "flask",
    "flask-babel",
    "flask-bootstrap",
    "flask-login",
    "flask-security-too",
    "flask-wtf",
    "itsdangerous",
    "wtforms",
    "wtforms-sqlalchemy",
    "bcrypt",
    "werkzeug",

    # general web
    "requests",
    "httpx",

    # Structures raw metering-provider SSE event dicts into the local
    # dataclasses in sparkmeter/metering/legacy_event_models.py.
    "cattrs",

    # AWS S3 — used by the historical-data feature in sparkmeter/history/.
    "boto3",

    # SQL
    "psycopg2-binary",
    "alembic",
    "sqlalchemy",
    "flask-sqlalchemy",

    # ASGI / FastAPI
    "fastapi",
    "hypercorn",
    "a2wsgi",
    # gRPC contract for the optional meter-driver profile. The generated
    # stubs come from the meter-driver-spec package (pinned to a spec tag),
    # not from local codegen; protobuf/grpcio are their runtime.
    "meter-driver-spec @ https://github.com/EarthSpark/meter-driver-spec/releases/download/v1.4.0/meter_driver_spec-1.4.0-py3-none-any.whl",
    "protobuf",
    "grpcio",
    "click",

    # dates and times
    "python-dateutil",

    # phone numbers
    "phonenumbers",

    # data vizualization
    "numpy",
    "pandas",
    "vincent",

    # Translation
    "babel",
    "speaklater",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
# uv's build isolation invokes hatch-vcs from a temp directory that
# doesn't contain `.git/`. Without this, setuptools-scm fails with
# "unable to detect version" even though `.git` exists in the build
# context. `search-parent-directories` makes scm walk up to find it.
raw-options.search_parent_directories = true

[tool.hatch.build.hooks.vcs]
version-file = "sparkmeter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sparkmeter"]


[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest-asyncio",
    "filelock",
    "factory-boy",
    "freezegun",
    "httmock",
    "testfixtures",
    "html5lib",
    "ruff>=0.15.21",
    "pydocstyle",
    "pre-commit",
    "pyopenapi-gen",
    "pytest-diagnose @ git+https://github.com/tescalada/pytest-diagnose.git",
    "pytest-randomly>=4.1.0",
]

[tool.ruff]
line-length = 110
extend-exclude = ["test-data"]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sparkmeter"]
