# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^test-data/
    -   id: end-of-file-fixer
        exclude: ^test-data/
    -   id: check-added-large-files

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: ^test-data/
      - id: ruff-format
        exclude: ^test-data/

-   repo: local
    hooks:
      - id: pydocstyle
        name: pydocstyle (non-blocking)
        entry: bash -c 'uv run pydocstyle --ignore=D211,D403 "$@" || true' --
        language: system
        types: [python]
        files: ^sparkmeter/
        verbose: true
      - id: verify-permissions
        name: verify decorator ordering
        entry: ./scripts/verify-permissions.sh
        args: ["sparkmeter"]
        language: script
        pass_filenames: false
        files: ^sparkmeter/.*\.py$
