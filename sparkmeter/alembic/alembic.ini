[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
revision_environment = true

[loggers]
keys = root,sqlalchemy,alembic,sparkmeter

[handlers]
keys = console

[formatters]
keys = generic

[logger_sparkmeter]
level = INFO
handlers = console
qualname = sparkmeter

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-7s %(asctime)s [%(name)-24s] %(message)s
