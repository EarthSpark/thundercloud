name: CI

on:
  push:
    tags: ["**"]
  pull_request:

concurrency:
  group: ci-build-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Defaults to GitHub Container Registry. Override via the repo's
  # Actions variable `REGISTRY` to push to a private registry instead.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-permissions.sh sparkmeter
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv python install 3.13
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pydocstyle --ignore=D211,D403 sparkmeter
        continue-on-error: true

  metering-wire-drift:
    # Verify the committed sparkmeter/metering/_generated/ matches what
    # the regen script would produce against the current spec. Catches
    # cases where the spec changed but the webapp client wasn't
    # regenerated, or where someone hand-edited generated files.
    #
    # TODO: parameterize the spec source. For now the job expects
    # `OPENAPI_URL` to be set (a CI secret / repo variable pointing at
    # the canonical openapi.json — release artifact, GitHub Pages, etc.)
    # If unset, the drift check is skipped so CI doesn't block on this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if spec source not configured
        id: have_spec
        run: |
          if [ -z "${{ vars.OPENAPI_URL }}" ]; then
            echo "OPENAPI_URL not set; skipping drift check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have_spec.outputs.skip != 'true'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - if: steps.have_spec.outputs.skip != 'true'
        run: uv python install 3.13
      - if: steps.have_spec.outputs.skip != 'true'
        name: Fetch openapi.json
        run: curl -fsSL "${{ vars.OPENAPI_URL }}" -o /tmp/openapi.json
      - if: steps.have_spec.outputs.skip != 'true'
        name: Regenerate metering client
        env:
          OPENAPI_PATH: /tmp/openapi.json
        run: ./scripts/regen-metering-wire.sh
      - if: steps.have_spec.outputs.skip != 'true'
        name: Verify no drift in committed _generated/
        run: git diff --exit-code sparkmeter/metering/_generated/

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads tags from `.git/` inside the build context
          # to derive the version; the default shallow checkout doesn't
          # include enough history for that.
          fetch-depth: 0
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests and diff-cover
        run: bash scripts/run_coverage.sh
      # The coverage reports are posted as PR comments by the
      # coverage-comment workflow. It runs in the base repo's context
      # because this job cannot comment: fork PRs get a read-only
      # GITHUB_TOKEN, which caps the pull-requests permission no matter
      # what is declared here. Upload runs even when the suite or the
      # coverage gate fails, so the comment explaining a red check is
      # still posted; whichever report files a failure suppressed are
      # simply absent from the artifact.
      - name: Upload coverage reports
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            pytest-coverage.txt
            junit.xml
            diff-cover-report.md
          retention-days: 7

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts/config && npm install
      - run: npx --prefix scripts/config jest --coverage --config scripts/config/package.json

  # Each platform builds on a runner of its own architecture, so nothing
  # is emulated. Neither job tags the image: each pushes an untagged
  # manifest addressed only by its digest, and docker-manifest below
  # joins the two digests into one multi-platform tag.
  docker-build:
    needs: [lint, test]
    # Fork PRs cannot push; they take the archive path in
    # docker-build-fork below.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags in the build
          # context; a shallow checkout omits the history it needs.
          fetch-depth: 0
      # GITHUB_REPOSITORY keeps the owner's capitalization; a registry
      # reference has to be lowercase. metadata-action does this for its
      # own output, but the exporter below needs the name directly.
      - name: Resolve image reference
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      # Labels only. The tags are applied to the manifest list, not to
      # the per-platform images.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
      # The digest is carried to the merge job as a filename; the file
      # itself is empty.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Resolve image reference
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=sha,format=long
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      # One manifest list per tag, referencing both per-platform digests
      # pushed above. DOCKER_METADATA_OUTPUT_JSON is set by
      # metadata-action.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect manifest list
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # Fork PRs run with a read-only token and cannot push, so the digest
  # merge above is unavailable to them: it needs both images in the
  # registry. Each platform still builds on a runner of its own
  # architecture — the runner label is not restricted by the token — and
  # uploads an archive of its own. The publish-pr workflow, running in
  # this repo's context, joins those archives into one multi-platform
  # image and pushes it under tags it controls.
  docker-build-fork:
    needs: [lint, test]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/pr-image-${{ matrix.arch }}.tar
          labels: ${{ steps.meta.outputs.labels }}
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/pr-image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
